services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tryon
      POSTGRES_PASSWORD: tryon_local_only
      POSTGRES_DB: tryon
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryon"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
  minio:
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    image: tryon-minio:2025-10-15
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: tryon_local
      MINIO_ROOT_PASSWORD: tryon_local_secret_change_me
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]
volumes:
  postgres:
  redis:
  minio:
